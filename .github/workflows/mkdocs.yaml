name: Deploy MkDocs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.pages'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions mkdocs-awesome-pages-plugin mkdocs-same-dir
      
      - name: copy state_graph
        run: |
          cp -r ./src/launch/nhk2025b_launch/state_graph ./docs/launch/nhk2025b_launch/state_graph

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
